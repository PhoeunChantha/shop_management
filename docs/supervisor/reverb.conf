; Laravel Reverb websocket server — keeps real-time notifications flowing.
; Copy to /etc/supervisor/conf.d/reverb.conf and adjust paths/user.
[program:reverb]
process_name=%(program_name)s
command=php /var/www/shop_management/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/shop_management
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/shop_management/storage/logs/reverb.log
stopwaitsecs=10
