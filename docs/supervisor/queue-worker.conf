; Queue worker — only needed if OrderStatusUpdated (or other jobs) implement
; ShouldQueue. Copy to /etc/supervisor/conf.d/queue-worker.conf and adjust paths.
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/shop_management/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/shop_management
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/shop_management/storage/logs/queue-worker.log
stopwaitsecs=3600
